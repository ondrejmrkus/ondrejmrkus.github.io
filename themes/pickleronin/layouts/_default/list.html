{{ partial "header.html" . }}

<div class="container-single">

  {{ partial "nav.html" . }}

  <div class="single">

    <h1>Archives</h1>

    {{ .Content }}

    {{ range.Data.Pages }}
    <article class="post-snippet">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
        {{ .Date.Format "Jan 2, 2006" }}
        </time>
    </article>
    {{ end }}

    {{ partial "newsletter.html" . }}
  </div>
</div>
