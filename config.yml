baseURL: 'https://ondrejmarkus.com/'
languageCode: en-us
theme: PaperMod
title: Ondrej Markus

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  blog: '/:slug/'
  games: '/:slug/'
  pages: '/:slug/'

outputs:
  home:
    - HTML
    - RSS
    - JSON # is necessary

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Game designer exploring why games matter."
  keywords: [ondrej markus, blog, game design, games]
  author: Ondrej Markus
  images: "digital-garage.jpg"
  DateFormat: "January 2, 2006"
  defaultTheme: light # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: /favicon/favicon.ico
    favicon16x16: /favicon/favicon16x16.png
    favicon32x32: /favicon/favicon32x32.png
    apple_touch_icon: /favicon/apple-touch-icon.png
    safari_pinned_tab: /favicon/apple-touch-icon.png

  label:
    text: "Ondrej Markus"

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Hey there, I'm Ondrej.
    subtitle: "Game designer exploring why games matter."
    imageUrl: "digital-garage.jpg"
    imageWidth: auto
    imageHeight: auto
    imageTitle: my image
    buttons:
      - name: Blog
        url: blog

  # home-info mode
  homeInfoParams:
    Title: Hey there, I'm Ondrej.
    Content: "Game designer exploring why games matter."

  socialIcons:
    - name: twitter
      url: "https://twitter.com/ondrej_markus"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 5
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: connect
      name: Connect
      url: /connect/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: emails
      name: Emails
      url: https://www.getrevue.co/profile/ondrej_markus
      weight: 30

module:
  imports:
    - path: "github.com/divinerites/plausible-hugo"

