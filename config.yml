baseURL: 'https://radiant-chimera-75c1b4.netlify.app/'
languageCode: en-us
theme: PaperMod
title: Ondrej Markus

enableRobotsTXT: false
buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  blog: '/:slug/'
  pages: '/:slug/'

outputs:
  home:
    - HTML
    - RSS
    - JSON # is necessary

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "designer, writer, introvert"
  keywords: [Blog, Portfolio]
  author: Ondrej Markus
  images: "digital-garage.jpg"
  DateFormat: "January 2, 2006"
  defaultTheme: light # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "<link / abs url>"
    favicon16x16: "<link / abs url>"
    favicon32x32: "<link / abs url>"
    apple_touch_icon: "<link / abs url>"
    safari_pinned_tab: "<link / abs url>"

  label:
    text: "Ondrej Markus"

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Hey there, I'm Ondrej.
    subtitle: "I'm exploring the intersection of **games**, **learning**, and **self-improvement**."
    imageUrl: "digital-garage.jpg"
    imageWidth: auto
    imageHeight: auto
    imageTitle: my image
    buttons:
      - name: Blog
        url: blog
      - name: Categories
        url: categories

  # home-info mode
  homeInfoParams:
    Title: Hey there, I'm Ondrej.
    Content: "I'm exploring the intersection of **games**, **learning**, and **self-improvement**."

  socialIcons:
    - name: twitter
      url: "https://twitter.com/ondrej_markus"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 5
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 20
    - identifier: archive
      name: Archive
      url: /archives/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

