baseURL: 'https://ondrejmarkus.com/'
languageCode: en-us
theme: PaperMod
title: Ondrej Markus

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  blog: '/:slug/'
  pages: '/:slug/'
  archives: '/:slug/'

outputs:
  home:
    - HTML
    - RSS
    - JSON # is necessary

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "A designer based in Prague, exploring game-based learning."
  keywords: [ondrej markus, blog, education, innovation, game design, game development, games, game-based learning]
  author: Ondrej Markus
  images: 
  DateFormat: "January 2, 2006"
  defaultTheme: light # dark, light

  ShowReadingTime: true
  hideFooter: true

  disableThemeToggle: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false


  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: /favicon/favicon.ico
    favicon16x16: /favicon/favicon16x16.png
    favicon32x32: /favicon/favicon32x32.png
    apple_touch_icon: /favicon/apple-touch-icon.png
    safari_pinned_tab: /favicon/apple-touch-icon.png

  label:
    text: "Ondrej Markus"

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title:
    subtitle: 
    imageUrl: 
    imageWidth: auto
    imageHeight: auto
    imageTitle: my image
    buttons:
      - name: Articles
        url: blog

  # home-info mode
  homeInfoParams:
    Title: Hey, I'm Ondrej
    Content: |

      I've been an [entrepreneur](https://ondrejmarkus.com/tags/entrepreneurship/), [designer](https://ondrejmarkus.com/3-levels/), and teacher. I'm an [introvert](https://ondrejmarkus.com/16/) and [self-learner](https://ondrejmarkus.com/tags/learning/). 

      These days, I'm creating [Playful](https://playful.cz) - a game-based education program for kids.

  socialIcons:
    - name: twitter
      url: https://twitter.com/ondrej_markus
    - name: youtube
      url: https://www.youtube.com/@ondrej_markus

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: blog
      name: Articles
      url: /blog/
      weight: 1
    - identifier: about
      name: About
      url: /about/
      weight: 3

